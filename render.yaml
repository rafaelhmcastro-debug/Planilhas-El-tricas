services:
  - type: web
    name: cabos-app
    env: python
    plan: free
    region: ohio

    # Comando para iniciar a aplicação
    startCommand: "cd cabos-app && uvicorn app.main:app --host 0.0.0.0 --port 8000"

    # Comando para instalar dependências
    buildCommand: "cd cabos-app && pip install -r requirements.txt"

    # Variáveis de ambiente
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cabos-db
          property: connectionString
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"

# Banco de dados PostgreSQL
databases:
  - name: cabos-db
    databaseName: cabosdb
    user: cabos_user
    region: ohio
    plan: free
