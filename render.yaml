services:
  - type: web
    name: cabos-app
    env: python
    plan: free
    region: ohio
    pythonVersion: 3.11

    # Comando para iniciar a aplicação
    startCommand: "cd cabos-app && uvicorn app.main:app --host 0.0.0.0 --port 8000"

    # Comando para instalar dependências (especificar caminho completo)
    buildCommand: "pip install -r cabos-app/requirements.txt"

    # Variáveis de ambiente
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cabos-db
          property: connectionString
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: REBUILD_TRIGGER
        value: "2026-09-15-rebuild-cache"

# Banco de dados PostgreSQL
databases:
  - name: cabos-db
    databaseName: cabosdb
    user: cabos_user
    region: ohio
    plan: free
